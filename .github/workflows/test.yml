name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # tests/ import from src/ and open-sse/, so the root deps are required
      # before the suite's own.
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm --prefix tests install --no-audit --no-fund

      # 客户端白屏门禁：只跑 no-undef（见 eslint.gate.config.mjs 的说明）。
      # v1.9.8 的 Loomy 页事故就是三个未定义标识符一路穿过单测和 build，
      # 只在浏览器 hydrate 时才抛 ReferenceError —— 这类问题 tsc/单测/build
      # 全都看不见，只有静态的未定义符号检查拦得住。
      # 主配置 eslint.config.mjs 有 145 条既有 error，不进 CI，这里单开一份。
      - name: Undefined-symbol gate
        run: npx eslint --config eslint.gate.config.mjs src/

      # The suite is not all-green: see tests/__baseline__/known-fails.txt.
      # Let it finish and let the gate below decide, rather than failing here.
      - name: Run test suite
        id: vitest
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/results.json"
        working-directory: tests

      - name: Registry baselines
        run: |
          set -euo pipefail
          node __baseline__/verify-providers.mjs
          node __baseline__/verify-alias.mjs
          node __baseline__/verify-oauth-urls.mjs
        working-directory: tests

      # Prints where every registry model resolves, then fails on any broken
      # invariant. --check is load-bearing: the vitest case in
      # tests/unit/capability-floor-allowlist.test.js gates the floor / vision
      # classes using this script's tables, but three classes are only computed
      # here (image-output without imageOutput:true, dead provider rows for
      # delisted models, duplicate model ids within a provider). Without the
      # flag those three printed a report and CI still went green.
      - name: Capability audit
        run: node --no-warnings scripts/audit-capabilities.mjs --check

      # Fails only on a test that passed in the baseline and fails now. To
      # re-baseline deliberately, download the artifact below and run
      # `node tests/__baseline__/snapshot-known-fails.mjs <results.json>`.
      - name: Regression gate
        run: node tests/__baseline__/verify-no-regression.mjs "$RUNNER_TEMP/results.json"

      - name: Upload results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: ${{ runner.temp }}/results.json
          if-no-files-found: warn
