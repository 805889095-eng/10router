name: Build 10Router fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fpk:
    strategy:
      matrix:
        arch: [x86, arm]
    runs-on: ${{ matrix.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build standalone server
        run: npm run build

      - name: Copy standalone to fnos-packaging
        run: |
          set -euo pipefail
          rm -rf fnos-packaging/app/server
          mkdir -p fnos-packaging/app/server
          cp -r .next/standalone/. fnos-packaging/app/server/
          cp -r open-sse fnos-packaging/app/server/
          cp -r src/mitm fnos-packaging/app/server/
          mkdir -p fnos-packaging/app/server/node_modules
          # 仅补 standalone **没带**的包。**绝不能覆盖** standalone 自带的 next:
          # 覆盖成完整版会把 standalone 精简版旁边的 @swc(scoped 追踪产物)一起清掉,
          # 装上就炸 `Cannot find module '@swc/helpers/_/_interop_require_default'`
          # (2026-10-08 NAS 实测,且旧覆盖式打法多带 ~170MB 构建期文件,见
          # docs/zh-CN/fnpk-size-reduction-1.3.6.md)。与 scripts/fpk-local.sh 保持一致。
          for pkg in node-forge sql.js next better-sqlite3 "@swc"; do
            if [ -d "fnos-packaging/app/server/node_modules/$pkg" ]; then
              echo "SKIP  $pkg (standalone already ships it)"
            else
              mkdir -p "fnos-packaging/app/server/node_modules/$pkg"
              cp -r "node_modules/$pkg/." "fnos-packaging/app/server/node_modules/$pkg/"
              echo "COPY  $pkg"
            fi
          done
          # 缺件早爆:比装到 NAS 上才发现快两个数量级
          for p in node_modules/@swc/helpers node_modules/next node_modules/sql.js open-sse src/mitm .next/BUILD_ID public custom-server.js; do
            [ -e "fnos-packaging/app/server/$p" ] || { echo "ERROR: missing $p"; exit 1; }
          done
          du -sh fnos-packaging/app/server
          ls -la fnos-packaging/app/server/

      - name: Download fnpack
        env:
          FNPACK_VERSION: "1.2.1"
        run: |
          if [ "${{ matrix.arch }}" = "arm" ]; then
            FNPACK_BIN="fnpack-${FNPACK_VERSION}-linux-arm64"
            FNPACK_SHA256="aad9e16b101267d30017f39ab969e3c085fbce209716f8bd3b1e167eaf15e0cf"
          else
            FNPACK_BIN="fnpack-${FNPACK_VERSION}-linux-amd64"
            FNPACK_SHA256="72d2a4095da676b64510b023731a227b369d80f8079bc45ff8a2f802ec0480c1"
          fi
          curl -fsSL -o /usr/local/bin/fnpack "https://static2.fnnas.com/fnpack/${FNPACK_BIN}"
          echo "${FNPACK_SHA256}  /usr/local/bin/fnpack" | sha256sum -c -
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -3

      # The fpk version is read straight out of fnos-packaging/manifest below, so the
      # manifest MUST be synced from package.json first — otherwise a release/tag bump
      # silently ships artifacts named after the previous version (v1.6.3 shipped
      # 10Router-FnOS-1.6.2-*.fpk because this step was missing).
      - name: Sync manifest version from package.json
        run: node scripts/sync-manifest-version.mjs

      - name: Set manifest platform
        run: |
          cd fnos-packaging
          if grep -qE '^platform[[:space:]]*=' manifest; then
            sed -i "s/^platform[[:space:]]*=.*/platform               = ${{ matrix.arch }}/" manifest
          else
            echo "platform               = ${{ matrix.arch }}" >> manifest
          fi
          grep -E '^(platform|appname|version|ctl_stop|install_dep_apps)[[:space:]]*=' manifest

      - name: Remove symlinks
        run: |
          find fnos-packaging -type l -not -path '*/.git/*' -delete 2>/dev/null || true
          echo "symlinks remaining: $(find fnos-packaging -type l -not -path '*/.git/*' | wc -l)"

      - name: Build url variant
        run: |
          set -euo pipefail
          cd fnos-packaging
          jq --exit-status '.".url"."10router.Application".type = "url"' app/ui/config > app/ui/config.tmp
          mv app/ui/config.tmp app/ui/config
          rm -f 10router.fpk
          fnpack build -d .
          [ -f 10router.fpk ] || { echo "ERROR: fnpack build url failed"; exit 1; }
          VERSION="$(grep -E '^version[[:space:]]*=' manifest | head -1 | sed 's/.*=//;s/[[:space:]]//g')"
          [ -n "$VERSION" ] || { echo "ERROR: could not extract version from manifest"; exit 1; }
          # 资产命名平台化 (v1.4.0 起): 与 CreditDaddy 的 <App>-<平台>-<变体>-<版本>-<arch> 对齐,
          # 同一 release 里同平台资产排序自动聚类。url 变体不带变体段;iframe 变体 = Window
          # (fnOS 内嵌窗口打开)。下方 sums / attach 的 glob 必须同步改 (Linux 大小写敏感)。
          mv 10router.fpk "10Router-FnOS-${VERSION}-${{ matrix.arch }}.fpk"
          ls -lh "10Router-FnOS-${VERSION}-${{ matrix.arch }}.fpk"

      - name: Build iframe variant
        run: |
          set -euo pipefail
          cd fnos-packaging
          jq --exit-status '.".url"."10router.Application".type = "iframe"' app/ui/config > app/ui/config.tmp
          mv app/ui/config.tmp app/ui/config
          rm -f 10router.fpk
          fnpack build -d .
          [ -f 10router.fpk ] || { echo "ERROR: fnpack build iframe failed"; exit 1; }
          VERSION="$(grep -E '^version[[:space:]]*=' manifest | head -1 | sed 's/.*=//;s/[[:space:]]//g')"
          [ -n "$VERSION" ] || { echo "ERROR: could not extract version from manifest"; exit 1; }
          mv 10router.fpk "10Router-FnOS-Window-${VERSION}-${{ matrix.arch }}.fpk"
          ls -lh "10Router-FnOS-Window-${VERSION}-${{ matrix.arch }}.fpk"

      - name: Upload fpk artifact
        # GitHub 免费版 artifact 存储配额只有 500MB，一次全平台发布会直接打爆，
        # 而且配额是按 6-12 小时重新计算的 —— 配额见底时连 27MB 的 fpk 都传不上去，
        # 打包成功却让整条流水线判红（2026-10-26 实测）。这里降级为「尽力而为」：
        # 真正的发布产物走下面的 workflow artifact (release_assets)，不进 artifact 存储。
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # artifact 名是 run 内部标识,不进 release,保持旧拼写;path glob 跟随平台化名
          name: 10router-fpk-${{ matrix.arch }}-${{ github.sha }}
          path: fnos-packaging/10Router-*.fpk
          if-no-files-found: error
          retention-days: 14

      # 发布产物不再依赖 artifact 存储中转：每个架构 job 生成 fpk 后，在 tag 发布时
      # 直接挂到 Release 上。配额见底也不会阻断发布（失败仅跳过，release job 会补传）。
      - name: Publish fpk to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: fnos-packaging/10Router-*.fpk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build-fpk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # fpk 已由各架构 job 直接挂上 Release（见 build-fpk 的 Publish 步骤）。
      # 这里不再 download-artifact：GitHub 免费版 artifact 配额 500MB，
      # 全平台发布一次就爆，且按 6-12h 重新计算，配额见底时连 27MB 都传不上去，
      # 会让「打包全部成功」被判红（2026-10-26 实测）。
      - name: Ensure release exists with title
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
              --title "10Router ${{ github.ref_name }}" \
              --notes "Release notes pending — see [CHANGELOG.md](https://github.com/techysy/10router/blob/main/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}

      # 校验清单：从 Release 上已存在的 fpk 资产算，供下载方 `sha256sum -c` 核对。
      # 三个发布工作流并行，各写各的一份，避免互相覆盖。
      # 怎么核对（以及它挡不了什么）见 docs/zh-CN/verify-downloads.md
      - name: Generate checksum
        run: |
          set -euo pipefail
          mkdir -p fpk-assets
          gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
            --pattern '10Router-FnOS-*.fpk' --dir fpk-assets --clobber
          ( cd fpk-assets && sha256sum 10Router-*.fpk > SHA256SUMS-fpk.txt )
          cat fpk-assets/SHA256SUMS-fpk.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload checksum to Release
        uses: softprops/action-gh-release@v2
        with:
          files: fpk-assets/SHA256SUMS-fpk.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ 10Router fpk 构建完成" >> "$GITHUB_STEP_SUMMARY"
          ls -lh fpk-assets/ >> "$GITHUB_STEP_SUMMARY"
