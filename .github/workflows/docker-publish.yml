name: Build and Push Docker Image

# Builds a ready-to-run container image from THIS repo's source, so a patched
# tree never has to be hot-patched into a running container by hand.
#
# Triggers:
#   * push to main          -> :main, :sha-<short>, :latest
#   * push of a v* tag      -> :<semver>, :latest
#   * manual dispatch       -> whatever ref you pick
#
# The upstream 24 GB heap requirement in `npm run build`
# (`--max-old-space-size=24576`) is an upper bound, not a demand — the
# ubuntu-latest runner (16 GB RAM / 4 vCPU) builds this tree fine because Node
# only commits what it actually touches. Do NOT add NODE_OPTIONS overrides
# here; the script's own flag already wins for the build step.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          # amd64 only by default: the arm64 leg runs under QEMU on the same
          # 4-vCPU runner and roughly triples wall time for a tree this size.
          # Uncomment the second platform (and raise the job timeout) if an
          # ARM box ever needs to pull this image.
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          build-args: |
            NODE_IMAGE=node:22-alpine

      # The image lands in GHCR, but pulling it needs a token with `packages:read`.
      # A box that only has a fine-grained PAT without that scope (or no
      # credentials at all) cannot pull it — which is exactly the situation on the
      # Hong Kong VPS. Export the same image to a tar so it can travel as a plain
      # Release asset and be loaded with `docker load`, no registry auth involved.
      - name: Export image tarball
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="10router-image-${VERSION}-amd64.tar.gz"
          # Buildx leaves the single-platform image in the local store under the
          # first tag metadata-action produced; load it explicitly by digest.
          docker pull "${GHCR_IMAGE}:${VERSION}"
          docker save "${GHCR_IMAGE}:${VERSION}" | gzip -9 > "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"

      - name: Attach image tarball to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            10router-image-*-amd64.tar.gz
            10router-image-*-amd64.tar.gz.sha256
          fail_on_unmatched_files: false

